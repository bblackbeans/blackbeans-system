[project]
name = "blackbeans-mcp"
version = "0.1.0"
description = "MCP server for BlackBeans System (tasks, status, time, sprints)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.12.0",
  "httpx>=0.28.0",
]

[project.scripts]
blackbeans-mcp = "blackbeans_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackbeans_mcp"]

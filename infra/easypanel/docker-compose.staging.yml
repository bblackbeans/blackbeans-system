services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    expose:
      - "80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ../../blackbeans-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_API_URL: http://api:5000
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  api: &backend
    build:
      context: ../../blackbeans-api
      dockerfile: compose/production/django/Dockerfile
    restart: unless-stopped
    environment: &backend_environment
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?configure no EasyPanel}
      DJANGO_ADMIN_URL: ${DJANGO_ADMIN_URL:?configure no EasyPanel}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?configure no EasyPanel}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?configure no EasyPanel}
      POSTGRES_USER: ${POSTGRES_USER:?configure no EasyPanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?gere no EasyPanel}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:?configure no EasyPanel}
      API_PUBLIC_BASE_URL: ${API_PUBLIC_BASE_URL:-}
      DJANGO_SECURE_SSL_REDIRECT: "true"
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      AGENT_LLM_ENABLED: ${AGENT_LLM_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-}
      RDSTATION_CRM_CLIENT_ID: ${RDSTATION_CRM_CLIENT_ID:-}
      RDSTATION_CRM_CLIENT_SECRET: ${RDSTATION_CRM_CLIENT_SECRET:-}
      RDSTATION_CRM_REDIRECT_URI: ${RDSTATION_CRM_REDIRECT_URI:-}
      RDSTATION_CRM_WEBHOOK_URL: ${RDSTATION_CRM_WEBHOOK_URL:-}
      INTEGRATIONS_FERNET_KEY: ${INTEGRATIONS_FERNET_KEY:-}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - django_media:/app/blackbeans_api/media
    expose:
      - "5000"
    # Exclusivo de staging: migrate e idempotente, mas exige exatamente 1 replica da API.
    command: ["/bin/bash", "-c", "python /app/manage.py migrate --noinput && exec /start"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:5000/api/v1/health', headers={'X-Forwarded-Proto':'https'}), timeout=4); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    <<: *backend
    environment: *backend_environment
    command: /start-celeryworker
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: []
    healthcheck:
      test: ["CMD-SHELL", "celery -A config.celery_app inspect ping --destination celery@$$HOSTNAME --timeout 4 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    <<: *backend
    environment: *backend_environment
    command: /start-celerybeat
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose: []
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure no EasyPanel}
      POSTGRES_USER: ${POSTGRES_USER:?configure no EasyPanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?gere no EasyPanel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  django_media:
